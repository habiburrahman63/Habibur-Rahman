    <!-- Apply the stored theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('portfolio_theme');
          var isDark = stored === null || stored === 'dark';
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Google Fonts: Inter (body) & Sora (display) & JetBrains Mono (accents)

         Inter and Sora are requested as *variable* fonts, so a single
         woff2 covers every weight used here - far fewer requests and a
         smaller payload than static weight lists. Inter additionally
         carries its optical-size (opsz) axis, which index.css turns on via
         `font-optical-sizing: auto`; that is what keeps 11px meta text
         sturdy while letting 64px headlines render with fine, even detail.
         Its italic axis is requested too (ital), so the testimonial quotes
         and the contact success message use a true italic rather than a
         synthetic oblique.

         `display=swap` shows real text immediately instead of blocking the
         first paint on the font, and the preconnects below remove the
         DNS/TLS round-trips that normally delay the font request.

         No <link rel="preload"> for the woff2 itself: Google Fonts splits
         variable fonts into unicode-range subsets, so a hardcoded file URL
         would not match the file the stylesheet actually requests and
         would download the font twice. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400..600&family=Sora:wght@500..800&display=swap"
    />
